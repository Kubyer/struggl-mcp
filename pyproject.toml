[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "struggl-mcp"
version = "1.3.1"
description = "Thin MCP client and Agent Skill for STRUGGL's Zero-LLM-Math sports-science calculators and hybrid-athlete training ledger."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
  { name = "Sing And Clap" }
]
keywords = ["mcp", "fitness", "hyrox", "running", "strength-training", "sports-science", "agent-skills"]
dependencies = [
  "mcp>=2.2.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[project.urls]
Homepage = "https://struggl.singandclap.com/connect"
Documentation = "https://struggl.singandclap.com/docs"
Repository = "https://github.com/Kubyer/struggl-mcp"

[project.scripts]
struggl-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server", "struggl_primitives"]
